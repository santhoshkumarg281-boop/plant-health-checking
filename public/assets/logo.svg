<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="6" y="6" width="88" height="88" rx="26" fill="url(#bgGrad)" />
  <rect x="7" y="7" width="86" height="86" rx="25" stroke="rgba(255,255,255,0.25)" stroke-width="2" fill="none" />

  <!-- AI Circuit Tech Grid Lines -->
  <path d="M22 30 H36 M64 30 H78 M20 50 H30 M70 50 H80 M24 70 H36 M64 70 H76" stroke="#A7F3D0" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.65" />
  <circle cx="36" cy="30" r="3" fill="#38BDF8" />
  <circle cx="64" cy="30" r="3" fill="#38BDF8" />
  <circle cx="30" cy="50" r="2.5" fill="#A7F3D0" />
  <circle cx="70" cy="50" r="2.5" fill="#A7F3D0" />
  <circle cx="36" cy="70" r="3" fill="#34D399" />
  <circle cx="64" cy="70" r="3" fill="#34D399" />

  <!-- Connection to center -->
  <path d="M36 30 L45 42 M64 30 L55 42 M36 70 L45 58 M64 70 L55 58" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />

  <!-- Robot Head Silhouette Base (Subtle) -->
  <rect x="34" y="32" width="32" height="26" rx="8" fill="#064E3B" opacity="0.4" />
  
  <!-- AI Antenna -->
  <path d="M50 32 V24" stroke="#FDE047" stroke-width="3" stroke-linecap="round" />
  <circle cx="50" cy="22" r="3.5" fill="#FDE047" filter="url(#glow)" />

  <!-- Plant Stem Rising from AI Core -->
  <path d="M50 78 C50 64 50 48 50 40" stroke="#ECFDF5" stroke-width="4.5" stroke-linecap="round" />
  <path d="M50 78 C50 64 50 48 50 40" stroke="#34D399" stroke-width="3" stroke-linecap="round" />

  <!-- Left Sprout Leaf (Organic Plant) -->
  <path d="M50 56 C40 54 32 44 33 34 C44 33 52 42 50 56 Z" fill="url(#leafGrad)" stroke="#ECFDF5" stroke-width="1.5" />
  <path d="M36 43 C42 45 48 49 50 56" stroke="#D1FAE5" stroke-width="1.2" stroke-linecap="round" />

  <!-- Right Sprout Leaf with AI Circuit / Modern Curve -->
  <path d="M50 46 C60 43 68 32 67 22 C56 22 48 32 50 46 Z" fill="url(#glowGrad)" stroke="#ECFDF5" stroke-width="1.5" />
  <path d="M64 30 C58 33 53 38 50 46" stroke="#FEF08A" stroke-width="1.2" stroke-linecap="round" />

  <!-- AI Robot Eyes (Glowing Tech Look) -->
  <circle cx="44" cy="46" r="3" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="56" cy="46" r="3" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="44" cy="45" r="1" fill="#FFFFFF" />
  <circle cx="56" cy="45" r="1" fill="#FFFFFF" />

  <!-- Sparkle Particle -->
  <path d="M72 18 L74 22 L78 24 L74 26 L72 30 L70 26 L66 24 L70 22 Z" fill="#FDE047" opacity="0.85" />
</svg>
