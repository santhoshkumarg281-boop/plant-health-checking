<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="mBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>
    <linearGradient id="leafG" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="mShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#064E3B" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#mBg)"/>
  
  <!-- Pot / Background subtle elements -->
  <circle cx="200" cy="150" r="110" fill="#A7F3D0" opacity="0.4"/>
  
  <!-- Monstera Leaf Stem -->
  <path d="M200 270 C200 210 200 130 195 40" stroke="#065F46" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Monstera Leaf Body with Fenestrations -->
  <g filter="url(#mShadow)">
    <path d="M195 40 C280 60 330 130 310 210 C290 260 220 265 195 260 C170 265 100 260 80 210 C60 130 110 60 195 40 Z" fill="url(#leafG)"/>
    
    <!-- Monstera Cuts (Fenestrations / Cutouts) -->
    <!-- Right side slits -->
    <path d="M195 70 C230 75 270 90 290 85 C285 100 240 100 195 90" fill="#ECFDF5"/>
    <path d="M195 110 C240 120 290 135 305 140 C295 155 245 145 195 130" fill="#ECFDF5"/>
    <path d="M195 155 C235 165 280 185 290 200 C275 208 230 190 195 175" fill="#ECFDF5"/>
    
    <!-- Left side slits -->
    <path d="M195 70 C160 75 120 90 100 85 C105 100 150 100 195 90" fill="#ECFDF5"/>
    <path d="M195 110 C150 120 100 135 85 140 C95 155 145 145 195 130" fill="#ECFDF5"/>
    <path d="M195 155 C155 165 110 185 100 200 C115 208 160 190 195 175" fill="#ECFDF5"/>

    <!-- Swiss Cheese internal holes -->
    <ellipse cx="170" cy="100" rx="6" ry="14" transform="rotate(-20 170 100)" fill="#ECFDF5"/>
    <ellipse cx="220" cy="115" rx="7" ry="16" transform="rotate(25 220 115)" fill="#ECFDF5"/>
    <ellipse cx="165" cy="150" rx="6" ry="15" transform="rotate(-15 165 150)" fill="#ECFDF5"/>
    <ellipse cx="225" cy="165" rx="7" ry="14" transform="rotate(20 225 165)" fill="#ECFDF5"/>

    <!-- Vein Details -->
    <path d="M195 40 L195 260" stroke="#34D399" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <path d="M195 90 L240 75 M195 130 L250 110 M195 175 L245 160" stroke="#34D399" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <path d="M195 90 L150 75 M195 130 L140 110 M195 175 L145 160" stroke="#34D399" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Health Badge in corner -->
  <rect x="20" y="20" width="105" height="30" rx="15" fill="#10B981"/>
  <text x="72" y="39" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">✅ HEALTHY</text>
  <text x="200" y="285" fill="#065F46" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Monstera Deliciosa (Swiss Cheese Plant)</text>
</svg>
