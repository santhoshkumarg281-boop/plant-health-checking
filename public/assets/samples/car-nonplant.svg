<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="cBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="carBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#cBg)"/>

  <!-- Road / ground -->
  <line x1="40" y1="230" x2="360" y2="230" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>

  <!-- Car Silhouette / Body -->
  <g>
    <!-- Roof & Cabin -->
    <path d="M120 150 L160 95 H250 L295 150 Z" fill="#1E293B"/>
    <!-- Glass windows -->
    <path d="M130 145 L165 102 H200 V145 Z" fill="#93C5FD"/>
    <path d="M210 102 H245 L280 145 H210 Z" fill="#93C5FD"/>

    <!-- Main Chassis -->
    <path d="M70 170 C70 150 90 145 120 145 H290 C320 145 345 155 345 175 L340 200 H65 Z" fill="url(#carBody)"/>

    <!-- Headlight & Taillight -->
    <rect x="330" y="160" width="12" height="8" rx="2" fill="#FDE047"/>
    <rect x="65" y="160" width="10" height="8" rx="2" fill="#EF4444"/>

    <!-- Wheels and Rims -->
    <!-- Front Wheel -->
    <circle cx="120" cy="205" r="28" fill="#1E293B"/>
    <circle cx="120" cy="205" r="16" fill="#94A3B8"/>
    <circle cx="120" cy="205" r="6" fill="#334155"/>

    <!-- Rear Wheel -->
    <circle cx="280" cy="205" r="28" fill="#1E293B"/>
    <circle cx="280" cy="205" r="16" fill="#94A3B8"/>
    <circle cx="280" cy="205" r="6" fill="#334155"/>
  </g>

  <!-- Non-Plant Test Tag -->
  <rect x="20" y="20" width="180" height="30" rx="15" fill="#64748B"/>
  <text x="110" y="39" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">🚫 NON-PLANT OBJECT</text>
  <text x="200" y="275" fill="#475569" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Automobile (Test Non-Plant Detection)</text>
</svg>
