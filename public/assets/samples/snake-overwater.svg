<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="sBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
    <linearGradient id="snakeLeafG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="15%" stop-color="#15803D"/>
      <stop offset="50%" stop-color="#166534"/>
      <stop offset="85%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#FACC15"/>
    </linearGradient>
    <linearGradient id="rotGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="60%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#713F12"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#sBg)"/>

  <!-- Plant pot -->
  <polygon points="150,260 250,260 265,220 135,220" fill="#EA580C"/>
  <rect x="130" y="215" width="140" height="10" rx="4" fill="#C2410C"/>

  <!-- Center upright sword leaf -->
  <path d="M200 40 C215 90 220 180 215 225 L185 225 C180 180 185 90 200 40 Z" fill="url(#snakeLeafG)"/>
  <!-- Cross banding patterns -->
  <path d="M190 80 Q200 75 210 80 M188 110 Q200 105 212 110 M186 140 Q200 135 214 140 M185 170 Q200 165 215 170" stroke="#86EFAC" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Left tilting leaf -->
  <path d="M150 70 C175 110 185 180 185 225 L165 225 C150 180 140 120 150 70 Z" fill="url(#snakeLeafG)"/>

  <!-- Right tilting leaf showing yellowing/browning soft rot base -->
  <path d="M250 80 C230 120 220 180 215 225 L235 225 C250 180 260 120 250 80 Z" fill="url(#snakeLeafG)"/>

  <!-- Root rot / overwatering base mushiness on bottom leaves -->
  <path d="M165 185 C185 175 215 175 235 185 L235 225 L165 225 Z" fill="url(#rotGrad)" opacity="0.95"/>
  <circle cx="200" cy="205" r="4" fill="#451A03" opacity="0.6"/>

  <!-- Needs Attention Badge -->
  <rect x="20" y="20" width="165" height="30" rx="15" fill="#F59E0B"/>
  <text x="102" y="39" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">⚠️ NEEDS ATTENTION</text>
  <text x="200" y="285" fill="#166534" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Snake Plant (Overwatering / Basal Stem Rot)</text>
</svg>
