<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="rBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="roseLeafG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#84CC16"/>
      <stop offset="50%" stop-color="#4D7C0F"/>
      <stop offset="100%" stop-color="#365314"/>
    </linearGradient>
    <radialGradient id="blackSpot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="70%" stop-color="#1E293B"/>
      <stop offset="85%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#rBg)"/>

  <!-- Rose Stem with small thorn -->
  <path d="M120 270 C160 210 210 140 260 50" stroke="#365314" stroke-width="6" stroke-linecap="round"/>
  <path d="M170 190 L185 195 L173 205 Z" fill="#365314"/>

  <!-- Rose leaflet (serrated edge aesthetic) -->
  <g>
    <!-- Chlorotic yellowing halo behind leaf -->
    <path d="M140 180 C110 130 140 80 230 70 C280 120 270 180 200 200 Z" fill="#FEF08A" opacity="0.6"/>
    
    <!-- Main leaf body -->
    <path d="M150 175 C125 135 150 90 225 80 C270 125 260 175 195 190 Z" fill="url(#roseLeafG)"/>
    
    <!-- Leaf Serration details -->
    <path d="M150 175 L158 170 L152 163 L162 155 L155 147 L167 138 L160 128 L175 118 L170 108 L188 98 L185 88 L208 82 L225 80" stroke="#84CC16" stroke-width="1.5" fill="none"/>

    <!-- Black Spot Fungal colonies -->
    <ellipse cx="180" cy="120" rx="16" ry="14" fill="url(#blackSpot)"/>
    <ellipse cx="220" cy="140" rx="20" ry="16" fill="url(#blackSpot)"/>
    <ellipse cx="170" cy="155" rx="12" ry="10" fill="url(#blackSpot)"/>
    <ellipse cx="235" cy="110" rx="10" ry="8" fill="url(#blackSpot)"/>
    
    <!-- Fringed fungal margin fibers -->
    <circle cx="220" cy="140" r="14" stroke="#0F172A" stroke-width="1.5" stroke-dasharray="2 2" fill="none"/>
  </g>

  <!-- Needs Attention Badge -->
  <rect x="20" y="20" width="165" height="30" rx="15" fill="#F59E0B"/>
  <text x="102" y="39" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">⚠️ NEEDS ATTENTION</text>
  <text x="200" y="285" fill="#78350F" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Rose Leaf (Black Spot / Diplocarpon rosae)</text>
</svg>
