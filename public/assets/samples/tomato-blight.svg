<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="tBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF2F2"/>
      <stop offset="100%" stop-color="#FEE2E2"/>
    </linearGradient>
    <linearGradient id="tomLeafG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="50%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <radialGradient id="blightSpot1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#451A03"/>
      <stop offset="40%" stop-color="#78350F"/>
      <stop offset="70%" stop-color="#B45309"/>
      <stop offset="90%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#tBg)"/>

  <!-- Tomato stem -->
  <path d="M70 260 C120 220 200 160 330 60" stroke="#166534" stroke-width="5" stroke-linecap="round"/>

  <!-- Leaflet 1 (Top) -->
  <g>
    <path d="M260 110 C290 60 340 50 350 45 C340 80 310 110 260 110 Z" fill="url(#tomLeafG)"/>
    <circle cx="310" cy="70" r="14" fill="url(#blightSpot1)"/>
  </g>

  <!-- Leaflet 2 (Left Major with heavy blight target spots) -->
  <g>
    <path d="M200 160 C130 110 90 120 70 130 C90 170 150 190 200 160 Z" fill="url(#tomLeafG)"/>
    <!-- Target Concentric Rings Blight Spots -->
    <ellipse cx="120" cy="145" rx="22" ry="18" fill="url(#blightSpot1)"/>
    <circle cx="120" cy="145" r="10" stroke="#78350F" stroke-width="1.5" fill="none"/>
    <circle cx="120" cy="145" r="5" fill="#291104"/>

    <!-- Yellow chlorosis halo around blight -->
    <path d="M80 135 C85 155 105 165 115 165" stroke="#EAB308" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Leaflet 3 (Right Major) -->
  <g>
    <path d="M220 145 C270 140 330 180 340 200 C290 210 240 180 220 145 Z" fill="url(#tomLeafG)"/>
    <ellipse cx="280" cy="175" rx="18" ry="14" fill="url(#blightSpot1)"/>
    <circle cx="280" cy="175" r="8" stroke="#78350F" stroke-width="1" fill="none"/>
    <path d="M300 185 C320 195 335 198 338 198" stroke="#EAB308" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Leaflet 4 (Lower with tip necrosis) -->
  <g>
    <path d="M140 210 C90 220 75 250 70 260 C110 260 130 240 140 210 Z" fill="url(#tomLeafG)"/>
    <path d="M70 260 C78 250 90 250 95 255 Z" fill="#451A03"/>
  </g>

  <!-- Unhealthy Badge -->
  <rect x="20" y="20" width="125" height="30" rx="15" fill="#EF4444"/>
  <text x="82" y="39" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">❗ UNHEALTHY</text>
  <text x="200" y="285" fill="#991B1B" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Tomato (Early Blight / Alternaria Solani)</text>
</svg>
